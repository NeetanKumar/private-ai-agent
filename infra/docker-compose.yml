# Private AI Agent Template
# Profiles:
#   gpu      -> runs Ollama in a container with NVIDIA GPU passthrough (rented GPU host)
#   cpu      -> runs Ollama in a container with no GPU (any ordinary server; slow, fine for a demo)
#   mac-dev  -> no Ollama container; gateway talks to Ollama running natively on the host
name: private-ai

services:
  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    # Every value in infra/.env (user tokens, the frontier key) reaches the gateway, so adding a user
    # is a config.yaml entry plus one line in infra/.env, with no change to this file.
    env_file: [.env]
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    volumes:
      - ./config.yaml:/app/infra/config.yaml:ro
      - audit_log:/audit
      - rag_data:/data/rag
      - actions_data:/data/actions    # local reminders storage (only used if actions.enabled is non-empty)
      - ../data/inbox:/inbox:ro       # one folder per user: data/inbox/<user id>/ (read-only tools + ingest)
    ports:
      # Loopback by default. To reach it over Tailscale, set GATEWAY_BIND to the host's tailnet IP.
      # Never 0.0.0.0.
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [edge, internal]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # One-shot model downloader: `make models`. The running model servers have no route to the internet
  # by design, so downloads happen here, in a container that exists only while it pulls. It shares the
  # model volume, is on its own network (NOT `edge`, so the host egress allowlist does not apply to
  # it, and NOT `internal`), publishes no port, and is removed when done.
  ollama-pull:
    profiles: [pull]
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve >/dev/null 2>&1 &
        for i in $$(seq 1 60); do ollama list >/dev/null 2>&1 && break; sleep 1; done
        for m in $${MODELS:?MODELS is empty}; do ollama pull "$$m" || exit 1; done
    environment:
      MODELS: ${MODELS:-}
    volumes:
      - ollama_models:/root/.ollama
    networks: [pull]
    # Docker's embedded resolver (127.0.0.11) forwards to whatever is in the host's /etc/resolv.conf.
    # On hosts running systemd-resolved that file points at the loopback stub 127.0.0.53, which is
    # not reachable from inside a container's network namespace, so lookups fail ("server
    # misbehaving") even though the host itself resolves names fine. Public resolvers sidestep it.
    dns: [1.1.1.1, 8.8.8.8]
    restart: "no"

  # Same model server without a GPU. Reachable by the gateway under the same name ("ollama"), same
  # volume, same internal-only network, no published port. Use `--profile cpu` instead of `gpu`.
  ollama-cpu:
    profiles: [cpu]
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    networks:
      internal:
        aliases: [ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  ollama:
    profiles: [gpu]
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    networks: [internal]          # no published ports, no external route
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

networks:
  pull: {}          # plain bridge with internet access, used only by the one-shot model downloader
  edge:
    # Fixed subnet so the host firewall rule in infra/egress-allowlist.sh can target it.
    # Only the gateway is attached to this network.
    ipam:
      config:
        - subnet: 172.28.0.0/24
  internal:
    internal: true

volumes:
  ollama_models: {}
  audit_log: {}
  actions_data: {}
  rag_data: {}
